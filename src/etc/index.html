<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neurobox</title>
    <meta name="description" content="Neurobox is a discord profile tracking api and a rich presence extension" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link href="css/index.css" rel="stylesheet" />
    <script src="js/index.js" defer></script>
</head>

<body>
    <!-- Scanline overlay -->
    <div class="scanlines" aria-hidden="true"></div>

    <!-- Pixel grid background -->
    <div class="pixel-grid" aria-hidden="true"></div>

    <!-- Decorative pixel stars -->
    <div class="stars" aria-hidden="true" id="stars"></div>

    <main class="hero">

        <!-- Title with gears -->
        <div class="title-container">
            <h1 class="title">NEURO<span class="title-box">BOX</span></h1>
            <div class="pixel-gear pixel-gear-1" aria-hidden="true"></div>
            <div class="pixel-gear pixel-gear-2" aria-hidden="true"></div>
        </div>



        <!-- Pixel art divider -->
        <div class="pixel-bar" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
        </div>

        <!-- Logo -->
        <img src="assets/NEUROBOX.svg" alt="NeuroBox Logo" class="logo-image" aria-hidden="true" />

        <!-- CTA Buttons -->
        <div class="cta-group">
            <a href="https://github.com/Sheathed/Neurobox-API" class="btn" id="btn-api">
                <span class="btn-text">&gt; PROFILE API</span>
            </a>
            <a href="https://github.com/Sheathed/Neurobox" class="btn" id="btn-presence">
                <span class="btn-text">&gt; RICH PRESENCE</span>
            </a>
        </div>


    </main>
</body>

</html>
